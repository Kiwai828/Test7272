name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # gradle-wrapper.jar is a binary that zip/git exports often omit.
      # Try multiple URL patterns (Gradle uses both v8.x.x and REL_8.x.x tags).
      - name: Restore gradle-wrapper.jar if missing
        run: |
          JAR=gradle/wrapper/gradle-wrapper.jar
          if [ ! -f "$JAR" ] || [ ! -s "$JAR" ]; then
            VER=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-bin|-all)' \
              gradle/wrapper/gradle-wrapper.properties)
            echo "Gradle version: $VER — downloading wrapper jar..."
            # Try v-prefixed tag first, then REL_ tag
            curl -fsSL \
              "https://raw.githubusercontent.com/gradle/gradle/v${VER}/gradle/wrapper/gradle-wrapper.jar" \
              -o "$JAR" 2>/dev/null || \
            curl -fsSL \
              "https://raw.githubusercontent.com/gradle/gradle/REL_${VER}/gradle/wrapper/gradle-wrapper.jar" \
              -o "$JAR"
            echo "Result: $(ls -lh $JAR)"
          else
            echo "gradle-wrapper.jar present ($(du -h $JAR | cut -f1))"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ─── Debug APK ─────────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RecapMaker-debug
          path: app/build/outputs/apk/debug/**.apk
          retention-days: 7

      # ─── Release APK ───────────────────────────────────────────────
      # Keystore secrets ရှိ  → signed release APK
      # Keystore secrets မရှိ → unsigned release APK (skip မဖြစ်)
      - name: Decode Keystore (if secrets present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/release.keystore
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "Keystore decoded OK"
          else
            echo "No KEYSTORE_BASE64 secret — building unsigned release APK"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RecapMaker-release
          path: app/build/outputs/apk/release/**.apk
          retention-days: 30
